<!doctype html>
<html>
<head>
    <!-- 1. Create a title e.g. Week 1 Exercise 1 -->
    <title>Week 1 Exercise 1</title>
</head>
<body>
    <!-- 2.1 Create a form -->
    <form>
        <!-- 2.2 Create a h1 e.g. Day Selector -->
        <h1>Day Selector</h1>
        <!-- 2.3 Make Sunday the default option -->
        <select>
            <option value='Monday'>Monday</option>
            <option value='Tuesday'>Tuesday</option>
            <option value='Sunday' selected>Sunday</option>
        </select>
        <!-- 2.4 Create a submit button e.g. <button type="submit"> -->
        <button type="submit">Submit</button>
    </form>
</body>
</html>
